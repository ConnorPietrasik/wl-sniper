[package]
name = "wl-sniper"
version = "1.0.0"
edition = "2024"
description = "Hold-to-sniper DPI switch daemon for WLmouse (HID protocol code derived from wl-mouse, AGPL-3.0-or-later)."
license = "AGPL-3.0-or-later"

[dependencies]
hidapi = "2"
evdev = "0.13"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Must stay in sync with the pre-warmed toolchain profile (see HANDOFF.md §1).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
